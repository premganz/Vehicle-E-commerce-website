<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle E-commerce</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-car"></i>
                Vehicle E-commerce
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-link" onclick="showVehicles()">All Vehicles</a>
                <div class="nav-dropdown">
                    <button class="nav-link dropdown-btn">
                        Categories <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-content">
                        <a href="#" onclick="filterByType('car')">Cars</a>
                        <a href="#" onclick="filterByType('motorcycle')">Motorcycles</a>
                        <a href="#" onclick="filterByType('boat')">Boats</a>
                    </div>
                </div>
                <a href="#" class="nav-link" onclick="showCart()">
                    <i class="fas fa-shopping-cart"></i>
                    Cart <span id="cart-count" class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Search and Filters -->
        <div class="search-section">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search vehicles..." class="search-input">
                <button onclick="searchVehicles()" class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            <div class="filters">
                <select id="sort-select" onchange="loadVehicles()" class="filter-select">
                    <option value="name,asc">Name (A-Z)</option>
                    <option value="name,desc">Name (Z-A)</option>
                    <option value="price,asc">Price (Low to High)</option>
                    <option value="price,desc">Price (High to Low)</option>
                </select>
                <input type="number" id="min-price" placeholder="Min Price" class="filter-input">
                <input type="number" id="max-price" placeholder="Max Price" class="filter-input">
                <button onclick="applyFilters()" class="filter-btn">Apply Filters</button>
                <button onclick="clearFilters()" class="filter-btn secondary">Clear</button>
            </div>
        </div>

        <!-- Vehicle Grid -->
        <div id="vehicle-grid" class="vehicle-grid">
            <!-- Vehicles will be loaded here -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination">
            <!-- Pagination controls will be loaded here -->
        </div>

        <!-- Cart Section (hidden by default) -->
        <div id="cart-section" class="cart-section" style="display: none;">
            <h2>Shopping Cart</h2>
            <div id="cart-items" class="cart-items">
                <!-- Cart items will be loaded here -->
            </div>
            <div class="cart-summary">
                <div class="cart-totals">
                    <div class="total-line">
                        <span>Subtotal:</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="total-line">
                        <span>Tax:</span>
                        <span id="cart-tax">$0.00</span>
                    </div>
                    <div class="total-line">
                        <span>Shipping:</span>
                        <span id="cart-shipping">$0.00</span>
                    </div>
                    <div class="total-line total">
                        <span>Total:</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                </div>
                <div class="cart-actions">
                    <button onclick="clearCart()" class="btn secondary">Clear Cart</button>
                    <button onclick="showCheckout()" class="btn primary">Checkout</button>
                </div>
            </div>
        </div>

        <!-- Checkout Section (hidden by default) -->
        <div id="checkout-section" class="checkout-section" style="display: none;">
            <h2>Checkout</h2>
            <form id="checkout-form" class="checkout-form">
                <div class="form-section">
                    <h3>Customer Information</h3>
                    <input type="text" id="customer-name" placeholder="Full Name" required>
                    <input type="email" id="customer-email" placeholder="Email" required>
                    <input type="tel" id="customer-phone" placeholder="Phone Number" required>
                </div>
                
                <div class="form-section">
                    <h3>Shipping Address</h3>
                    <textarea id="shipping-address" placeholder="Complete shipping address" required rows="4"></textarea>
                </div>
                
                <div class="form-section">
                    <h3>Payment Information</h3>
                    <select id="payment-method" required>
                        <option value="">Select Payment Method</option>
                        <option value="credit">Credit Card</option>
                        <option value="debit">Debit Card</option>
                        <option value="paypal">PayPal</option>
                    </select>
                    <input type="text" id="card-number" placeholder="Card Number" required>
                    <div class="card-details">
                        <input type="text" id="expiry-date" placeholder="MM/YY" required>
                        <input type="text" id="cvv" placeholder="CVV" required>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" onclick="showCart()" class="btn secondary">Back to Cart</button>
                    <button type="submit" class="btn primary">Place Order</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Loading Spinner -->
    <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Modal Title</h3>
                <button onclick="closeModal()" class="modal-close">&times;</button>
            </div>
            <div id="modal-body" class="modal-body">
                Modal content goes here
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
